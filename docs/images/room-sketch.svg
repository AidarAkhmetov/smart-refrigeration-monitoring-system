<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <rect width="640" height="640" fill="#ffffff"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Cold room sketch (not to scale)</text>

  <!-- room -->
  <polygon points="210,70 440,70 500,500 90,500" fill="#eef5fb" stroke="#333" stroke-width="3"/>
  <text x="325" y="62" text-anchor="middle" fill="#333">7.11 m</text>
  <text x="400" y="518" text-anchor="middle" fill="#333">10.73 m</text>
  <text x="128" y="290" text-anchor="middle" fill="#333" transform="rotate(-74 128 290)">12.36 m</text>
  <text x="495" y="290" text-anchor="middle" fill="#333" transform="rotate(82 495 290)">11.75 m</text>
  <text x="300" y="250" text-anchor="middle" font-size="15" fill="#333">Cold room</text>
  <text x="300" y="268" text-anchor="middle" fill="#555">106.2 m2, ceiling 3.0 m, -18 to -20 °C</text>

  <!-- evaporator -->
  <rect x="245" y="74" width="160" height="22" fill="#5b8fd6" stroke="#2c5aa0"/>
  <text x="325" y="89" text-anchor="middle" fill="#fff" font-weight="bold">Evaporator</text>
  <text x="325" y="114" text-anchor="middle" fill="#2c5aa0">cold air blows this way ↓</text>

  <!-- door -->
  <line x1="105" y1="445" x2="119" y2="395" stroke="#8a3fc4" stroke-width="9"/>
  <text x="58" y="425" text-anchor="middle" fill="#8a3fc4" font-weight="bold">Door</text>
  <text x="58" y="441" text-anchor="middle" fill="#8a3fc4">to the yard</text>

  <!-- office -->
  <rect x="90" y="503" width="150" height="80" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <text x="165" y="550" text-anchor="middle" fill="#333">Office</text>
  <circle cx="104" cy="517" r="7" fill="#2e9e4f"/>
  <text x="118" y="571" fill="#2e9e4f" font-size="12">socket + internet</text>

  <!-- planned hole -->
  <circle cx="135" cy="500" r="6" fill="none" stroke="#d23c3c" stroke-width="3"/>
  <text x="152" y="490" fill="#d23c3c" font-size="12">planned hole (last step)</text>

  <!-- sensor points -->
  <g fill="#f0a020" stroke="#9a6400" stroke-width="1.5">
    <circle cx="325" cy="135" r="9"/>
    <circle cx="300" cy="300" r="9"/>
    <circle cx="140" cy="455" r="9"/>
    <circle cx="465" cy="470" r="9"/>
  </g>
  <g font-weight="bold" fill="#222" font-size="11" text-anchor="middle">
    <text x="325" y="139">1</text><text x="300" y="304">2</text><text x="140" y="459">3</text><text x="465" y="474">4</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <circle cx="300" cy="545" r="7" fill="#f0a020" stroke="#9a6400"/>
    <text x="313" y="549">Planned sensor points:</text>
    <text x="313" y="566">1 evaporator outlet · 2 middle</text>
    <text x="313" y="583">3 door · 4 far corner (likely warmest)</text>
    <text x="313" y="606" fill="#777">Shape and positions from the building plan, approximate</text>
  </g>
</svg>
